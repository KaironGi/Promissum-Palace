<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quartos | Promissum Palace</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="topo">

        <h1>Promissum Palace</h1>

        <p>Gerenciamento de Quartos</p>

    </header>

    <main class="container">

        <section class="card">

            <h2>Cadastrar Quarto</h2>

            <form id="formQuarto">

                <div class="campo">

                    <label for="numero">
                        Número do Quarto
                    </label>

                    <input
                        type="number"
                        id="numero"
                        placeholder="Digite o número"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="tipo_quarto">
                        Tipo do Quarto
                    </label>

                    <select id="tipo_quarto" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                        <option value="luxo">
                            Luxo
                        </option>

                        <option value="suite">
                            Suíte
                        </option>

                    </select>

                </div>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </section>

        <section class="card">

            <h2>Lista de Quartos</h2>

            <div class="barra-pesquisa">

                <input
                    type="text"
                    id="pesquisaQuarto"
                    placeholder="Pesquisar por número"
                >

                <button id="btnPesquisarQuarto">Pesquisar</button>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Valor Diária</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody id="tabelaQuartos">

                </tbody>

            </table>
        <div class="paginacao">
            <button onclick="paginaAnteriorQuartos()">Anterior</button>

            <span id="infoPaginaQuartos"></span>

            <button onclick="proximaPaginaQuartos()">Próximo</button>
        </div>

        </section>

    </main>

    <script src="js/quartos.js"></script>

</body>

</html>
